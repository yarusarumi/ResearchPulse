<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型设置 · ResearchPulse</title>
<style>
:root{color-scheme:light;--ink:#203441;--muted:#4d6673;--line:#d7e2e6;--accent:#106c58}
body{margin:0;background:#f2f5f6;color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:28px 18px 48px}
h1{font-size:28px;margin:20px 0 4px}h2{font-size:20px;margin:0 0 10px}a{color:var(--accent)}
p{margin:8px 0;color:var(--muted)}section,form{margin-top:18px;padding:22px;background:white;border:1px solid var(--line);border-radius:12px}
label{display:block;margin:12px 0}input[type=password],select{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #aebfc6;border-radius:6px;font:inherit;color:inherit;background:white}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit;border:1px solid #afc1c8;padding:8px 14px;border-radius:6px;background:white;color:inherit;cursor:pointer}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.55;cursor:default}
#notice{min-height:1.5em}code{overflow-wrap:anywhere}
</style>
<main>
<a href="/">← 返回研究台</a>
<h1>本机模型设置</h1>
<p>接通一个模型即可。参与分析的必要资料会发给所选模型服务。</p>
<form id="model-form" autocomplete="off">
    <h2>分析模型</h2>
    <label>主模型
        <select id="backend"><option value="sol-high">Codex</option><option value="deepseek">DeepSeek</option></select>
    </label>
    <p id="codex-status" role="status">正在读取 Codex 状态…</p>
    <div class="actions">
        <button type="button" id="codex-login" disabled>登录 Codex</button>
        <button type="button" id="refresh-codex" disabled>刷新模型列表</button>
        <a id="codex-install" href="https://developers.openai.com/codex/cli/" target="_blank" rel="noopener noreferrer" hidden>安装 Codex CLI ↗</a>
    </div>
    <div id="codex-choices" hidden>
        <label for="codex-model">Codex 模型</label>
        <select id="codex-model"></select>
        <label for="codex-effort">推理强度</label>
        <select id="codex-effort"></select>
    </div>
    <label>DeepSeek API Key
        <input id="deepseek-key" type="password" maxlength="512" autocomplete="off">
    </label>
    <p id="deepseek-status"></p>
    <label><input id="fallback" type="checkbox"> Codex 额度用尽时，允许本次任务改用 DeepSeek</label>
    <div class="actions">
        <button class="primary" type="submit" disabled>保存设置</button>
        <button type="button" id="check-model" disabled>测试连接</button>
        <button type="button" id="remove-deepseek" hidden>移除 DeepSeek Key</button>
    </div>
    <p id="notice" role="status">正在读取设置…</p>
</form>
<section aria-labelledby="reader-title">
    <h2 id="reader-title">论文阅读组件</h2>
    <p id="reader-status">正在检查…</p>
</section>
</main>
<script nonce="__TOKEN__">
const node = id => document.getElementById(id);
const form = node('model-form');
const secret = node('deepseek-key');
const remove = node('remove-deepseek');
const notice = node('notice');
const primary = form.querySelector('[type=submit]');
const codexModel = node('codex-model');
const codexEffort = node('codex-effort');
const codexStatus = node('codex-status');
const codexLogin = node('codex-login');
const refreshCodex = node('refresh-codex');
let settings;
let catalog;
let readingCatalog = false;
let awaitingLogin = false;
async function request(path, data) {
    const options = data ? {method:'POST', headers:{'Content-Type':'application/json', 'X-Review-Token':'__TOKEN__'},
        body:JSON.stringify(data)} : {};
    const response = await fetch(path, options);
    if (response.status === 401) location.replace('/login');
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '请求未完成');
    return result;
}
function render(state) {
    settings = {...settings, ...state};
    node('backend').value = settings.backend;
    node('fallback').checked = settings.fallback_enabled;
    if (!catalog) {
        codexLogin.disabled = !settings.codex_installed;
        refreshCodex.disabled = false;
        node('codex-install').hidden = settings.codex_installed;
    }
    node('deepseek-status').textContent = settings.deepseek_configured
        ? '已使用 Windows 用户凭据保护保存密钥。输入新密钥可替换。'
        : '使用 DeepSeek 时，请输入你的 API Key。';
    remove.hidden = !settings.deepseek_configured;
    node('reader-status').textContent = settings.reader_installed
        ? 'Docling 和 BGE-M3 均已安装。安装后重新启动研究台即可使用论文推荐与深读。'
        : settings.docling_installed
            ? '已内置 Docling。要使用论文推荐和深读，请双击「安装 BGE-M3」并在安装后重启研究台。'
            : '未找到内置的 Docling，请完整解压研究台安装包。';
}
function chooseEfforts(effort) {
    const model = catalog?.models.find(item => item.id === codexModel.value);
    const labels = {none:'无', minimal:'极低', low:'低', medium:'中', high:'高',
        xhigh:'很高', max:'最高', ultra:'极高'};
    const options = model?.efforts || [];
    codexEffort.replaceChildren(...options.map(item => new Option(labels[item] || item, item)));
    codexEffort.disabled = !options.length;
    if (!options.length) codexEffort.add(new Option('跟随模型默认值', ''));
    codexEffort.value = options.includes(effort) ? effort : model?.default_effort || options[0] || '';
    if (options.length && !codexEffort.value) codexEffort.selectedIndex = 0;
}
async function loadCatalog() {
    if (readingCatalog) return;
    readingCatalog = true;
    refreshCodex.disabled = true;
    codexLogin.disabled = true;
    codexStatus.textContent = '正在读取 Codex 模型列表…';
    try {
        const beforeModel = codexModel.options.length ? codexModel.value : settings?.codex_model;
        const beforeEffort = codexEffort.options.length ? codexEffort.value : settings?.codex_effort;
        catalog = await request('/api/desktop/codex/models');
        const {installed, signed_in, models} = catalog;
        const selected = models.find(item => item.id === beforeModel);
        const defaultModel = models.find(item => item.is_default);
        const defaultLabel = defaultModel ? 'Codex 默认模型 · ' + defaultModel.label : 'Codex 默认模型';
        codexModel.replaceChildren(new Option(defaultLabel, ''), ...models.map(item => new Option(item.label, item.id)));
        codexModel.value = selected?.id || '';
        chooseEfforts(selected?.id === beforeModel ? beforeEffort : null);
        node('codex-choices').hidden = !models.length;
        node('codex-install').hidden = installed;
        codexLogin.textContent = signed_in ? '重新登录或切换账号' : '登录 Codex';
        codexStatus.textContent = !installed ? '请安装 Codex CLI，或使用 DeepSeek。安装后刷新模型列表。'
            : !signed_in ? '请在 Codex 打开的官方浏览器页面登录。'
            : !models.length ? '已登录 Codex。暂时无法获取可选模型，请稍后刷新。'
            : beforeModel && selected?.id !== beforeModel ? '之前的模型在此账号下不可用，请重新选择并保存。'
            : '已登录 Codex。以下是当前账号可选的模型。';
        if (signed_in && models.length) awaitingLogin = false;
    } catch (error) {
        codexStatus.textContent = error.message;
    } finally {
        readingCatalog = false;
        refreshCodex.disabled = false;
        codexLogin.disabled = !(catalog?.installed ?? settings?.codex_installed);
    }
}
codexModel.addEventListener('change', () => chooseEfforts());
refreshCodex.onclick = loadCatalog;
codexLogin.onclick = async () => {
    codexLogin.disabled = true;
    try {
        const result = await request('/api/desktop/codex/login', {});
        awaitingLogin = result.started;
        codexStatus.textContent = result.message;
    } catch (error) {
        codexStatus.textContent = error.message;
    } finally {
        codexLogin.disabled = false;
    }
};
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && awaitingLogin) loadCatalog();
});
async function busy(action) {
    [primary, node('check-model'), remove].forEach(b => b.disabled = true);
    try { await action(); } catch (error) { notice.textContent = error.message; }
    finally { [primary, node('check-model'), remove].forEach(b => b.disabled = !settings); }
}
async function save(changes) {
    const state = await request('/api/desktop/models', changes);
    secret.value = '';
    render(state);
}
form.onsubmit = event => {
    event.preventDefault();
    busy(async () => {
        const changes = {backend:node('backend').value, fallback_enabled:node('fallback').checked};
        if (changes.backend === 'sol-high' && catalog?.models.length) {
            changes.codex_model = codexModel.value;
            changes.codex_effort = codexEffort.value;
        }
        if (secret.value.trim()) changes.deepseek_api_key = secret.value.trim();
        await save(changes);
        notice.textContent = '已保存，对下次启动的任务生效。';
    });
};
node('check-model').onclick = () => busy(async () => {
    if (secret.value.trim()) { notice.textContent = '请先保存新密钥，再测试连接。'; return; }
    notice.textContent = '正在测试连接…';
    const result = await request('/api/desktop/models/test', {backend:node('backend').value});
    notice.textContent = result.message;
});
remove.onclick = () => busy(async () => {
    await save({remove_deepseek:true});
    notice.textContent = '已移除 DeepSeek Key。';
});
busy(async () => {
    render(await request('/api/desktop/models'));
    notice.textContent = '';
}).then(loadCatalog);
</script>
</html>
